<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Tailwind CSS</title>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    </head>
    <body>
        <div class="grid grid-cols-4 my-8 mx-4 gap-2">
            <div class="border p-4 bg-[#58D5F1] col-start-1 col-end-5">Header</div>

            <div class="border p-4 bg-[#A2C463] row-start-2 row-end-4">Sidebar</div>

            <div class="border p-4 bg-[#F6C634] col-start-2 col-end-5 grid grid-cols-3 gap-1">
                <div class="border p-2 grow-1 row-start-1 row-end-3">NestedSidebar</div>
                <div class="border p-2 grow-2 col-start-2 col-end-4">NestedMain</div>
                <div class="border p-2 grow-1 col-start-2 col-end-4">NestedExtra</div>
            </div>
            <div class="border p-4 bg-[#8E898D] col-start-2 col-end-5">Extra</div>

            <div class="border p-4 bg-[#FFA500] col-start-1 col-end-5">Footer</div>
        </div>
    </body>
</html>
