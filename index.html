<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>HTML Forms</title>
    </head>
    <body>
        <center>
            <h1>Register here</h1>

            <form>
                <label>
                    Name
                    <input type="text" placeholder="Name..." />
                </label>

                <label>
                    <input type="checkbox" value="apple" />
                    Apple
                </label>
                <label>
                    <input type="checkbox" value="orange" />
                    Orange
                </label>
                <label>
                    <input type="checkbox" value="Grapes" />
                    Grapes
                </label>

                <br /><br />

                <label>
                    <input type="radio" name="sex" />
                    Male
                </label>

                <label>
                    <input type="radio" name="sex" />
                    Female
                </label>

                <br /><br />

                <input 
                    type="date"
                    min="2026-01-24"
                />

                <input 
                    type="datetime-local"
                />

                <input 
                    type="color"
                />

                <input 
                    type="button"
                    value="Submit"
                />
            </form>
        </center>
    </body>
</html>
