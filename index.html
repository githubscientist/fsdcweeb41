<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>CSS - Cascading Style Sheets</title>

        <!-- Internal Stylesheet -->
        <style>
            /* css selectors */
            /* highest precendence */
            #greetingID {
                color: green;
            }

            .greetingClass {
                color: red;
            }

            h1 {
                color: chocolate !important;
            }
        </style>
    </head>
    <body>
        <h1 id="greetingID" class="greetingClass">Welcome to my Web Page</h1>
    </body>
</html>
